name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_NAME: WinDivert-2.2.2-A.zip
  WINDIVERT_BASENAME: WinDivert-2.2.2-A
  WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15
  WERROR: -Werror=format -Werror=array-bounds -Werror=stringop-overflow -Werror=stringop-overread

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - run: mkdir -p /tmp/mingw-debs

      # Failed runs save what they managed to download, so a slow mirror only has to be beaten once.
      - uses: actions/cache/restore@v6
        with:
          path: /tmp/mingw-debs/*.deb
          key: mingw-debs-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mingw-debs-v1-

      - name: Install MinGW-w64
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::archives=/tmp/mingw-debs -o APT::Keep-Downloaded-Packages=true \
            binutils-mingw-w64-x86-64 binutils-mingw-w64-i686 \
            gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix \
            mingw-w64-x86-64-dev mingw-w64-i686-dev

      - if: always()
        uses: actions/cache/save@v6
        with:
          path: /tmp/mingw-debs/*.deb
          key: mingw-debs-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download WinDivert
        run: |
          wget -q "$WINDIVERT_URL"
          echo "$WINDIVERT_SHA256  $WINDIVERT_NAME" | sha256sum -c
          unzip -q "$WINDIVERT_NAME"

      - name: Build x86_64
        run: >
          cd src && make CPREFIX=x86_64-w64-mingw32- CC="x86_64-w64-mingw32-gcc-posix $WERROR" BIT64=1
          WINDIVERTHEADERS=../$WINDIVERT_BASENAME/include
          WINDIVERTLIBS=../$WINDIVERT_BASENAME/x64 -j4
          && mkdir -p ../out && cp adiosdpi.exe ../out/adiosdpi-x86_64.exe

      - name: Build i686
        run: >
          cd src && make clean && make CPREFIX=i686-w64-mingw32- CC="i686-w64-mingw32-gcc-posix $WERROR"
          WINDIVERTHEADERS=../$WINDIVERT_BASENAME/include
          WINDIVERTLIBS=../$WINDIVERT_BASENAME/x86 -j4
          && cp adiosdpi.exe ../out/adiosdpi-x86.exe

      # The executables as built here, to try them or to measure them without building again.
      - uses: actions/upload-artifact@v7
        with:
          name: adiosdpi-exe
          path: out/
          retention-days: 14

      # What a user downloads: the program, the WinDivert files it needs next to it, and the licenses.
      # A 32-bit program on 64-bit Windows loads the 64-bit driver, so the x86 folder has both.
      - name: Package
        run: |
          for arch in x64 x86; do
            d=zip/AdiosDPI-$arch
            mkdir -p $d/lists
            if [ $arch = x64 ]; then
              cp out/adiosdpi-x86_64.exe $d/adiosdpi.exe
              cp $WINDIVERT_BASENAME/x64/WinDivert.dll $WINDIVERT_BASENAME/x64/WinDivert64.sys $d/
            else
              cp out/adiosdpi-x86.exe $d/adiosdpi.exe
              cp $WINDIVERT_BASENAME/x86/WinDivert.dll $WINDIVERT_BASENAME/x86/WinDivert32.sys $WINDIVERT_BASENAME/x86/WinDivert64.sys $d/
            fi
            cp $WINDIVERT_BASENAME/LICENSE $d/WinDivert-LICENSE.txt
            cp LICENSE NOTICE README.md README.tr.md $d/
            cp lists/*.txt $d/lists/
            (cd zip && zip -qr AdiosDPI-$arch.zip AdiosDPI-$arch)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: adiosdpi-zip
          path: zip/*.zip
          retention-days: 14

  # The packet code (split points, split pieces, the md5 fake) checked on real Windows,
  # because the checksum helpers come from WinDivert.dll. No driver and no admin rights needed.
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          curl -sSLO "$WINDIVERT_URL"
          echo "$WINDIVERT_SHA256  $WINDIVERT_NAME" | sha256sum -c
          7z x -y "$WINDIVERT_NAME" > /dev/null
          WINDIVERT="$PWD/$WINDIVERT_BASENAME" sh tests/run.sh

  # A tag v* makes a draft release with the two zips and their checksums. The notes are written by hand
  # and the draft is published by hand. A tag with a dash (v0.1.0-rc.1) is marked pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the version inside the program, which the window and -h show.
      - name: Check version
        run: |
          v=$(sed -n 's/^#define ADIOSDPI_VERSION "\(.*\)"/\1/p' src/adiosdpi.c)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: adiosdpi-zip
          path: zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd zip && sha256sum *.zip > SHA256SUMS.txt)
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" zip/* --draft $pre --title "AdiosDPI $GITHUB_REF_NAME" --notes "Notes follow."
